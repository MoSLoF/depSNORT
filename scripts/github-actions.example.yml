# depSNORT supply-chain gate for GitHub Actions (Decision D-30).
# Drop into .github/workflows/. Static, zero-execution: it resolves lockfiles
# and never runs `npm install` / `pip install` / a lifecycle hook.
name: supply-chain-gate
on: [push, pull_request]

jobs:
  depsnort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Build the scanner (or replace with a released binary download).
      - name: build depsnort
        run: go build -o /usr/local/bin/depsnort ./cmd/depsnort

      - name: supply-chain scan
        env:
          # Uncomment to cross-check against your exported IOC ledger (VC-003):
          # IOC: .security/ioc-ledger.json
          FAIL_ON_ELIGIBLE: '0'   # set to 1 to fail on gate-eligible warnings too
          REPORT_DIR: reports
          SARIF_OUT: depsnort.sarif
        run: sh scripts/depsnort-ci-gate.sh

      # Surface findings in the repo Security tab (optional).
      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: depsnort.sarif

      - name: archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depsnort-report
          path: reports/
