name: refresh-bundled-snapshot

# Regenerates the OSV fallback dataset compiled into the binary
# (internal/datasource/osv/bundled_snapshot.json) from a live query against
# this repo's own reference fixtures, and pushes the result to a fresh branch
# for human review — it does NOT open the PR itself (see below).
#
# DELIBERATELY manual-trigger only — no `schedule:`. This is an on-demand
# action a maintainer runs when they want the dataset refreshed, not an
# autonomous process with standing write access: it never runs on its own,
# and it never touches main directly — only a fresh branch, which still has
# to go through a real PR like any other change. The alternative (a
# scheduled job with contents:write running unattended on a cadence) is real
# attack surface this project doesn't need to carry for a dataset that's
# fine to refresh by hand a few times a release.
#
# Scoped to contents:write only — no pull-requests:write. Most repos disable
# "Allow GitHub Actions to create and approve pull requests" by default,
# which is itself a sensible boundary (it stops any workflow, compromised or
# not, from silently opening/self-approving PRs), so this workflow doesn't
# fight it: it pushes the branch and stops. GitHub renders a
# "Create a pull request" link for any freshly pushed branch without any
# special permission — open it from there, or from wherever you're
# triggering this workflow with credentials that can create PRs.
on:
  workflow_dispatch: {}

permissions:
  contents: write # push the regenerated file to a new branch only

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.24'

      - name: refresh bundled snapshot
        run: make refresh-bundled-snapshot

      - name: check for changes
        id: diff
        run: |
          if git diff --quiet -- internal/datasource/osv/bundled_snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push refresh branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -eu
          BRANCH="refresh-bundled-snapshot-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add internal/datasource/osv/bundled_snapshot.json
          git commit -m "chore: refresh compiled-in OSV fallback dataset"
          git push origin "$BRANCH"
          {
            echo "### Bundled OSV dataset refreshed"
            echo ""
            echo "Pushed to \`$BRANCH\`. Open a PR from it:"
            echo ""
            echo "https://github.com/${{ github.repository }}/pull/new/$BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: no changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "bundled_snapshot.json is already current — nothing to push."
